# DeepSeek Harness + Tailscale compose example.
#
# Host mode (default): the containers share the host's network stack. The
# harness binds 127.0.0.1:${DSH_BACKEND_PORT}; Caddy binds
# 127.0.0.1:${DSH_PUBLIC_PORT}, authorizes sensitive API calls with Tailscale
# Serve identity headers, and proxies to the harness. No ports are published.
#
# Own-node mode: set TS_AUTHKEY and the entrypoint joins the tailnet as its
# own node and serves :443 itself (no host-side serve needed).
#
# Environment (or docker/.env):
#   DEEPSEEK_API_KEY=sk-...   # required for chat; not required to serve the GUI
#   DEEPSEEK_BASE_URL=          # optional DeepSeek-compatible endpoint
#   DSH_TELEGRAM_BOT_TOKEN=   # optional dsh-telegram bot token
#   DSH_PUBLIC_PORT=4080      # Tailscale Serve proxy target
#   DSH_BACKEND_PORT=4081     # harness loopback port
#   DSH_TRUSTED_HOSTS=        # extra /api authorities (run-docker.sh pre-fills the tailnet IPv4 + MagicDNS name)
#   TAILSCALE_OWNER=          # login allowed to use loopback-only API methods
#   TS_AUTHKEY=               # unset = host mode; set = own tailnet node
#   TS_HOSTNAME=dsh
#   TS_EXTRA_ARGS=
#   DSH_HOST_USER_HOME=/home/xel      # bind the host user's files at the same path
#   DSH_HOST_WORKSPACE=                # agent working directory (run-docker.sh derives it)
#   DSH_HOST_FLUTTER_HOME=             # Flutter SDK path (run-docker.sh derives it)
#   DSH_HOST_ANDROID_HOME=             # Android SDK path (run-docker.sh derives it)
#   DSH_HOST_JAVA_HOME=                # host JDK path (run-docker.sh derives it)
#
# Toolchain paths are optional: an empty value leaves the container without
# that toolchain. Conventional Rust, Go, Bun, Kotlin, and user-local bins under
# the mounted home are appended to PATH and are inert when absent.
# run-docker.sh additionally generates a per-launch override
# file mounting the JDK (read-only), the Android SDK, out-of-home Flutter and
# repository paths, udev state, and the USB bus — only when they exist on the
# host, because Compose cannot express a conditional bind mount. Under rootless
# podman that override also sets `userns_mode: keep-id` so the container's
# DSH_UID maps to the invoking host user.
#
# SELinux hosts (Fedora enforces by default) would deny the container access
# to the bind-mounted home and toolchains; `label=disable` opts this service
# out of SELinux confinement instead of relabeling the mounted paths (`:z` on
# a whole home directory would rewrite every file's label on the host).
#
# The app binds loopback only; Tailscale (inside the image when TS_AUTHKEY is
# set, or on the host in host mode) serves it over the tailnet.
services:
  dsh:
    build:
      context: ..
      dockerfile: Dockerfile
    image: dsh-tailscale:local
    restart: unless-stopped
    network_mode: host
    # Reap orphaned children (the pnpm/tsx process tree, tailscaled): the
    # entrypoint execs away its shell, so without an init the kernel would
    # leave those children parentless when they exit.
    init: true
    security_opt:
      - label=disable
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-}
      - DSH_TELEGRAM_BOT_TOKEN=${DSH_TELEGRAM_BOT_TOKEN:-}
      - DSH_TASK_BOARD_PROXY_TOKEN=${DSH_TASK_BOARD_PROXY_TOKEN:-}
      - DSH_HOME=${DSH_HOST_USER_HOME:-/home/xel}/.dsh
      - DSH_PORT=${DSH_BACKEND_PORT:-4081}
      - DSH_WORKSPACE=${DSH_HOST_WORKSPACE:-${DSH_HOST_USER_HOME:-/home/xel}/git}
      - DSH_REPO=${DSH_REPO:-/home/xel/git/deepseek/deepseek-harness}
      - DSH_TRUSTED_HOSTS=${DSH_TRUSTED_HOSTS:-}
      - DSH_UID=${DSH_UID:-1000}
      - DSH_GID=${DSH_GID:-1000}
      - HOME=${DSH_HOST_USER_HOME:-/home/xel}
      - ANDROID_HOME=${DSH_HOST_ANDROID_HOME:-}
      - ANDROID_SDK_ROOT=${DSH_HOST_ANDROID_HOME:-}
      - JAVA_HOME=${DSH_HOST_JAVA_HOME:-}
      - FLUTTER_ROOT=${DSH_HOST_FLUTTER_HOME:-}
      - ADB_SERVER_SOCKET=tcp:127.0.0.1:5037
      - PATH=${DSH_HOST_FLUTTER_HOME:-${DSH_HOST_USER_HOME:-/home/xel}/flutter}/bin:${DSH_HOST_ANDROID_HOME:-${DSH_HOST_USER_HOME:-/home/xel}/Android/Sdk}/platform-tools:${DSH_HOST_JAVA_HOME:-${DSH_HOST_USER_HOME:-/home/xel}/.sdkman/candidates/java/current}/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:${DSH_HOST_USER_HOME:-/home/xel}/.local/bin:${DSH_HOST_USER_HOME:-/home/xel}/.cargo/bin:${DSH_HOST_USER_HOME:-/home/xel}/.local/go-current/bin:${DSH_HOST_USER_HOME:-/home/xel}/go/bin:${DSH_HOST_USER_HOME:-/home/xel}/.bun/bin:${DSH_HOST_USER_HOME:-/home/xel}/.sdkman/candidates/kotlin/current/bin
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_HOSTNAME=${TS_HOSTNAME:-dsh}
      - TS_EXTRA_ARGS=${TS_EXTRA_ARGS:-}
    volumes:
      - ${DSH_HOST_USER_HOME:-/home/xel}:${DSH_HOST_USER_HOME:-/home/xel}
      - tsstate:/var/lib/tailscale # reuses your tailnet node identity

  auth-proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    user: "1000:1000"
    network_mode: host
    # Same SELinux opt-out as the dsh service: Caddy only reads the mounted
    # Caddyfile, but Fedora would still deny that read without this.
    security_opt:
      - label=disable
    depends_on:
      dsh:
        condition: service_healthy
    environment:
      - DSH_PUBLIC_PORT=${DSH_PUBLIC_PORT:-4080}
      - DSH_BACKEND_PORT=${DSH_BACKEND_PORT:-4081}
      - DSH_BIND_ADDRESS=127.0.0.1
      - DSH_VPN_PROVIDER=tailscale
      - TAILSCALE_OWNER=${TAILSCALE_OWNER:-__remote_settings_disabled__}
      - DSH_TASK_BOARD_PROXY_TOKEN=${DSH_TASK_BOARD_PROXY_TOKEN:-}
    volumes:
      - ../deployment/Caddyfile:/etc/caddy/Caddyfile:ro

volumes:
  tsstate:
