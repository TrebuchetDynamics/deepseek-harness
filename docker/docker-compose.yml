# DeepSeek Harness + Tailscale compose example.
#
# Host mode (default): the containers share the host's network stack. The
# harness binds 127.0.0.1:${DSH_BACKEND_PORT}; Caddy binds
# 127.0.0.1:${DSH_PUBLIC_PORT}, authorizes sensitive API calls with Tailscale
# Serve identity headers, and proxies to the harness. No ports are published.
#
# Own-node mode: set TS_AUTHKEY and the entrypoint joins the tailnet as its
# own node and serves :443 itself (no host-side serve needed).
#
# Environment (or docker/.env):
#   DEEPSEEK_API_KEY=sk-...   # required for chat; not required to serve the GUI
#   DSH_PUBLIC_PORT=4080      # Tailscale Serve proxy target
#   DSH_BACKEND_PORT=4081     # harness loopback port
#   DSH_TRUSTED_HOSTS=        # extra /api authorities (space or comma separated)
#   TAILSCALE_OWNER=          # login allowed to use loopback-only API methods
#   TS_AUTHKEY=               # unset = host mode; set = own tailnet node
#   TS_HOSTNAME=dsh
#   TS_EXTRA_ARGS=
#   DSH_HOST_USER_HOME=/home/xel      # bind the host user's files at the same path
#   DSH_HOST_FLUTTER_HOME=             # Flutter SDK path (run-docker.sh derives it)
#   DSH_HOST_JAVA_HOME=                # host JDK path (run-docker.sh derives it)
#
# The app binds loopback only; Tailscale (inside the image when TS_AUTHKEY is
# set, or on the host in host mode) serves it over the tailnet.
services:
  dsh:
    build:
      context: ..
      dockerfile: Dockerfile
    image: dsh-tailscale:local
    restart: unless-stopped
    network_mode: host
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DSH_HOME=${DSH_HOST_USER_HOME:-/home/xel}/.dsh
      - DSH_PORT=${DSH_BACKEND_PORT:-4081}
      - DSH_WORKSPACE=${DSH_HOST_USER_HOME:-/home/xel}/git
      - DSH_TRUSTED_HOSTS=${DSH_TRUSTED_HOSTS:-}
      - HOME=${DSH_HOST_USER_HOME:-/home/xel}
      - ANDROID_HOME=/usr/lib/android-sdk
      - ANDROID_SDK_ROOT=/usr/lib/android-sdk
      - JAVA_HOME=${DSH_HOST_JAVA_HOME:-/home/xel/.sdkman/candidates/java/current}
      - FLUTTER_ROOT=${DSH_HOST_FLUTTER_HOME:-${DSH_HOST_USER_HOME:-/home/xel}/flutter}
      - ADB_SERVER_SOCKET=tcp:127.0.0.1:5037
      - PATH=${DSH_HOST_FLUTTER_HOME:-${DSH_HOST_USER_HOME:-/home/xel}/flutter}/bin:/usr/lib/android-sdk/platform-tools:${DSH_HOST_JAVA_HOME:-/home/xel/.sdkman/candidates/java/current}/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_HOSTNAME=${TS_HOSTNAME:-dsh}
      - TS_EXTRA_ARGS=${TS_EXTRA_ARGS:-}
    volumes:
      - ${DSH_HOST_USER_HOME:-/home/xel}:${DSH_HOST_USER_HOME:-/home/xel}
      - ${DSH_HOST_JAVA_HOME:-/home/xel/.sdkman/candidates/java/current}:${DSH_HOST_JAVA_HOME:-/home/xel/.sdkman/candidates/java/current}:ro
      - /usr/lib/android-sdk:/usr/lib/android-sdk
      - /run/udev:/run/udev:ro
      - /dev/bus/usb:/dev/bus/usb
      - tsstate:/var/lib/tailscale # reuses your tailnet node identity

  auth-proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    user: "1000:1000"
    network_mode: host
    depends_on:
      dsh:
        condition: service_healthy
    environment:
      - DSH_PUBLIC_PORT=${DSH_PUBLIC_PORT:-4080}
      - DSH_BACKEND_PORT=${DSH_BACKEND_PORT:-4081}
      - TAILSCALE_OWNER=${TAILSCALE_OWNER:-__remote_settings_disabled__}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro

volumes:
  tsstate:
